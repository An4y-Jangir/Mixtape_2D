<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Halftone Grid Pattern -->
    <pattern id="halftone" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#d94025" opacity="0.4"/>
      <circle cx="10" cy="10" r="1.5" fill="#d94025" opacity="0.4"/>
    </pattern>

    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a08"/>
      <stop offset="50%" stop-color="#2a0d0a"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>

    <linearGradient id="cassetteBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c2826"/>
      <stop offset="40%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0f0c0b"/>
    </linearGradient>

    <linearGradient id="tapeLabel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fdf4dc"/>
    </linearGradient>

    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="480" fill="url(#bgGrad)"/>
  <rect width="1200" height="480" fill="url(#halftone)"/>

  <!-- CRT Vignette & Ambient Radial Glow -->
  <circle cx="600" cy="240" r="400" fill="#dc2626" opacity="0.12" filter="url(#glow)"/>
  <circle cx="350" cy="240" r="280" fill="#f59e0b" opacity="0.1" filter="url(#glow)"/>

  <!-- ================= CASSETTE TAPE ILLUSTRATION (LEFT/CENTER) ================= -->
  <g transform="translate(120, 75)" filter="url(#shadow)">
    <!-- Outer Cassette Shell -->
    <rect width="460" height="290" rx="20" fill="url(#cassetteBody)" stroke="#44403c" stroke-width="4"/>
    
    <!-- Top Screws -->
    <circle cx="25" cy="25" r="5" fill="#78716c" stroke="#1c1917" stroke-width="2"/>
    <circle cx="435" cy="25" r="5" fill="#78716c" stroke="#1c1917" stroke-width="2"/>
    <circle cx="25" cy="265" r="5" fill="#78716c" stroke="#1c1917" stroke-width="2"/>
    <circle cx="435" cy="265" r="5" fill="#78716c" stroke="#1c1917" stroke-width="2"/>
    <circle cx="230" cy="275" r="5" fill="#78716c" stroke="#1c1917" stroke-width="2"/>

    <!-- Top Label Area (Folded Paper) -->
    <rect x="35" y="30" width="390" height="155" rx="10" fill="url(#tapeLabel)" stroke="#1c1917" stroke-width="2"/>
    
    <!-- Red/Orange Top Accent Header -->
    <path d="M 35 40 Q 35 30 45 30 L 415 30 Q 425 30 425 40 L 425 68 L 35 68 Z" fill="#0284c7"/>
    <text x="50" y="55" font-family="'Courier New', monospace" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="3">CRX 60 • TYPE II CHROME</text>
    <text x="370" y="55" font-family="'Courier New', monospace" font-size="14" font-weight="900" fill="#bae6fd">SIDE A</text>

    <!-- Handwritten Title Simulation -->
    <text x="55" y="105" font-family="sans-serif" font-size="24" font-weight="800" fill="#0c4a6e" font-style="italic">A Mixtape FOR TANISHA 🖤</text>
    <text x="55" y="128" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#0369a1">by @AnayJ • 2 x 30 min • High Bias 70µs</text>

    <!-- Bottom Tape Notch & Window -->
    <rect x="110" y="145" width="240" height="85" rx="12" fill="#0c0a09" stroke="#57534e" stroke-width="2"/>
    
    <!-- Transparent Central Film & Magnetic Spools -->
    <rect x="150" y="160" width="160" height="55" rx="6" fill="#1c1917" stroke="#292524" stroke-width="1.5"/>

    <!-- Left Reel (Magnetic Tape Roll + White Hub) -->
    <circle cx="185" cy="188" r="28" fill="#3d2417"/>
    <circle cx="185" cy="188" r="16" fill="#f5f5f4" stroke="#a8a29e" stroke-width="2"/>
    <circle cx="185" cy="188" r="7" fill="#1c1917"/>
    <!-- Teeth -->
    <rect x="183" y="174" width="4" height="28" fill="#1c1917"/>
    <rect x="171" y="186" width="28" height="4" fill="#1c1917"/>

    <!-- Center Window Gauge Lines -->
    <line x1="222" y1="180" x2="222" y2="195" stroke="#78716c" stroke-width="2"/>
    <line x1="230" y1="175" x2="230" y2="200" stroke="#f59e0b" stroke-width="2"/>
    <line x1="238" y1="180" x2="238" y2="195" stroke="#78716c" stroke-width="2"/>

    <!-- Right Reel (Magnetic Tape Roll + White Hub) -->
    <circle cx="275" cy="188" r="24" fill="#3d2417"/>
    <circle cx="275" cy="188" r="16" fill="#f5f5f4" stroke="#a8a29e" stroke-width="2"/>
    <circle cx="275" cy="188" r="7" fill="#1c1917"/>
    <!-- Teeth -->
    <rect x="273" y="174" width="4" height="28" fill="#1c1917"/>
    <rect x="261" y="186" width="28" height="4" fill="#1c1917"/>

    <!-- Bottom Trapezoid Head Area -->
    <path d="M 120 290 L 150 235 L 310 235 L 340 290 Z" fill="#171514" stroke="#44403c" stroke-width="2"/>
    <circle cx="170" cy="265" r="7" fill="#0c0a09" stroke="#57534e" stroke-width="2"/>
    <circle cx="290" cy="265" r="7" fill="#0c0a09" stroke="#57534e" stroke-width="2"/>
    <rect x="205" y="255" width="50" height="20" rx="3" fill="#292524" stroke="#57534e" stroke-width="1.5"/>

    <!-- Holographic Star Sticker on Cassette -->
    <g transform="translate(380, 75) rotate(15) scale(0.9)">
      <polygon points="25,0 32,15 49,18 37,30 40,47 25,39 9,47 13,30 1,18 17,15" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
      <polygon points="25,5 30,17 44,19 34,29 36,42 25,36 13,42 16,29 6,19 20,17" fill="#ec4899" opacity="0.6"/>
    </g>

    <!-- Faux Masking Tape Top Corner -->
    <g transform="translate(-10, -8) rotate(-18)">
      <rect width="60" height="24" fill="#edd8a4" opacity="0.85" rx="2"/>
    </g>
  </g>

  <!-- ================= TYPOGRAPHY & BRANDING (RIGHT SIDE) ================= -->
  <g transform="translate(640, 110)">
    <!-- Subtitle Badge with Torn Masking Tape Style -->
    <g transform="rotate(-1)">
      <rect x="0" y="0" width="240" height="34" rx="4" fill="#8f1d14" stroke="#b91c1c" stroke-width="1.5"/>
      <text x="12" y="23" font-family="'Courier New', monospace" font-size="13" font-weight="900" fill="#fef08a" letter-spacing="2">AUTHENTIC 90s STUDIO</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="95" font-family="impact, sans-serif" font-size="62" font-weight="900" fill="#ffffff" letter-spacing="2">
      MIXTAPE <tspan fill="#f59e0b">2D</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="132" font-family="sans-serif" font-size="18" font-weight="700" fill="#e2e8f0" letter-spacing="1">
      Build Something Worth Rewinding.
    </text>

    <!-- Feature Bullet Badges -->
    <g transform="translate(0, 160)">
      <!-- Badge 1: YouTube Music -->
      <g transform="translate(0, 0)">
        <rect width="195" height="32" rx="16" fill="#1c1917" stroke="#ef4444" stroke-width="1.5"/>
        <circle cx="16" cy="16" r="6" fill="#ef4444"/>
        <text x="32" y="21" font-family="'Courier New', monospace" font-size="11" font-weight="800" fill="#ffffff">YOUTUBE MUSIC STREAM</text>
      </g>

      <!-- Badge 2: Ad Free -->
      <g transform="translate(205, 0)">
        <rect width="130" height="32" rx="16" fill="#1c1917" stroke="#06b6d4" stroke-width="1.5"/>
        <circle cx="16" cy="16" r="6" fill="#06b6d4"/>
        <text x="32" y="21" font-family="'Courier New', monospace" font-size="11" font-weight="800" fill="#38bdf8">100% AD-FREE</text>
      </g>

      <!-- Badge 3: Skeuomorphic Deck -->
      <g transform="translate(345, 0)">
        <rect width="140" height="32" rx="16" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5"/>
        <circle cx="16" cy="16" r="6" fill="#f59e0b"/>
        <text x="32" y="21" font-family="'Courier New', monospace" font-size="11" font-weight="800" fill="#fde047">STEREO DECK</text>
      </g>
    </g>

    <!-- Creator Tag Footer -->
    <g transform="translate(0, 220)">
      <text x="0" y="16" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#a8a29e">
        Crafted with 📼 by <tspan fill="#f59e0b" font-weight="900">@AnayJ</tspan> • React + Vite + Web Audio
      </text>
    </g>
  </g>

  <!-- Bottom Accent Strip (Neon Tape Trim) -->
  <rect x="0" y="474" width="1200" height="6" fill="url(#amberGlow)"/>
</svg>
